[project]
name = "circularis-rel"
version = "0.1.0"
description = "Sistema de confiabilidad Weibull y gestión de mantenimiento para Circularis (línea T-WOOD)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Circularis" }]
dependencies = [
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "pydantic>=2.9,<3",
    "openpyxl>=3.1.5,<3.2",
    "pandas>=2.2,<3",
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "reliability==0.9.0",
    "surpyval==0.24",
    "lifelines>=0.30,<0.31",
    "streamlit>=1.40,<2",
    "streamlit-authenticator==0.4.2",
    "bcrypt>=4.2,<6",
    "plotly>=5.24,<7",
    "matplotlib>=3.9,<4",
    "fpdf2>=2.8,<3",
    "segno>=1.6,<2",
    "pillow>=11,<13",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "hypothesis>=6.115",
    "ruff>=0.7",
]

[project.scripts]
circularis = "circularis_rel.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["circularis_rel*"]

[tool.setuptools.package-data]
"circularis_rel" = ["datos/migraciones/*.ini", "datos/migraciones/*.mako", "motor/tablas/*.csv", "app/estilos/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not lento'"
markers = [
    "lento: pruebas exhaustivas (Monte Carlo largo); correr con -m lento",
    "referencia: casos publicados (Plan y bibliografía)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
extend-exclude = ["circularis_rel/datos/migraciones/versions"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
